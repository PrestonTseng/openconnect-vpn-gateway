services:
  vpn:
    build:
      context: .
    container_name: openconnect-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    # If any container sharing this network namespace exposes ports, publish them here.
    # Example: application dashboard/API ports. Do not put ports: on services that use network_mode: service:vpn.
    # ports:
    #   - "8081:8081"
    #   - "8082:8082"
    #   - "8083:8083"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Example dependent service. Replace this with your application service(s).
  app-example:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do date; sleep 60; done"]
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
